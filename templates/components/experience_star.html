<form method="post" action="{% url 'main:toggle_star' experience.id %}" class="star-form" style="display: inline-block;">
    {% csrf_token %}
    <button type="submit"
        class="button button-star{% if user in experience.starred_by.all %} is-starred{% endif %}"
        style="display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.8rem;"
        title="{% if experience.starred_by.all %}Starred by {{ experience.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true" style="font-size: 1.2rem; line-height: 1;">
            {% if user in experience.starred_by.all %}★{% else %}☆{% endif %}
        </span>
        <span class="star-count">{{ experience.starred_by.count }}</span>
    </button>
</form>
